<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeowGo - ADMIN PANEL</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00ff66">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --hacker-green: #00ff66;
      --hacker-green-glow: rgba(0, 255, 102, 0.3);
      --hacker-bg: #0c100d;
      --hacker-card: #121814;
      --hacker-border: #1e2d22;
      --hacker-red: #ff3344;
      --hacker-text-muted: #a0c0a8;
    }

    * {
      box-sizing: border-box;
      font-family: 'Fira Code', Consolas, 'Courier New', monospace;
    }

    body {
      background-color: var(--hacker-bg);
      color: #e0f5e5;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    .hacker-card {
      background-color: var(--hacker-card);
      border: 1px solid var(--hacker-border);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .navbar-hacker {
      background-color: #060807;
      border-bottom: 2px solid var(--hacker-green);
      box-shadow: 0 0 15px var(--hacker-green-glow);
    }

    .navbar-brand {
      color: var(--hacker-green) !important;
      font-weight: bold;
      letter-spacing: 1.5px;
    }

    .form-control, .form-select {
      background-color: #080a09 !important;
      color: #ffffff !important;
      border: 1px solid var(--hacker-border) !important;
      border-radius: 8px;
      padding: 0.6rem 0.9rem;
    }

    .form-control:focus, .form-select:focus {
      border-color: var(--hacker-green) !important;
      box-shadow: 0 0 10px var(--hacker-green-glow) !important;
    }

    .form-control::placeholder {
      color: var(--hacker-text-muted) !important;
      opacity: 0.6;
    }

    .btn-hacker {
      background: linear-gradient(135deg, #0d2613, #153e1f);
      color: var(--hacker-green);
      border: 1px solid var(--hacker-green);
      font-weight: bold;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .btn-hacker:hover {
      background: var(--hacker-green);
      color: #000;
      box-shadow: 0 0 12px var(--hacker-green-glow);
    }

    .btn-hacker-danger {
      background: linear-gradient(135deg, #2a080c, #4a1016);
      color: var(--hacker-red);
      border: 1px solid var(--hacker-red);
      font-weight: bold;
      border-radius: 8px;
    }

    .btn-hacker-danger:hover {
      background: var(--hacker-red);
      color: #fff;
      box-shadow: 0 0 12px rgba(255, 51, 68, 0.4);
    }

    .nav-tabs {
      border-bottom: 1px solid var(--hacker-border);
    }

    .nav-tabs .nav-link {
      color: var(--hacker-text-muted);
      border: 1px solid transparent;
      border-radius: 8px 8px 0 0;
      font-weight: 600;
    }

    .nav-tabs .nav-link.active {
      background-color: var(--hacker-card) !important;
      color: var(--hacker-green) !important;
      border-color: var(--hacker-border) var(--hacker-border) transparent !important;
    }

    .badge-hacker {
      background-color: #0d2814;
      color: var(--hacker-green);
      border: 1px solid var(--hacker-green);
      padding: 0.4em 0.7em;
    }

    .badge-danger-custom {
      background-color: #380a0e;
      color: var(--hacker-red);
      border: 1px solid var(--hacker-red);
      padding: 0.4em 0.7em;
    }

    .post-img-thumb {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--hacker-border);
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-hacker sticky-top mb-4">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="#">
        <i class="fa-solid fa-terminal"></i> MEOWGO_ADMIN
      </a>
      <span class="badge badge-hacker"><i class="fa-solid fa-shield-halved me-1"></i> ROOT_ACCESS</span>
    </div>
  </nav>

  <div class="container">

    <!-- BARRA DI RICERCA GLOBALE -->
    <div class="hacker-card p-3 mb-4">
      <label for="global-search" class="form-label fw-bold text-warning mb-1">
        <i class="fa-solid fa-magnifying-glass me-1"></i> [RICERCA_GLOBALE]
      </label>
      <input type="text" id="global-search" class="form-control" placeholder="Cerca username, ID utente o nome del gatto nei post...">
    </div>

    <!-- TABS -->
    <ul class="nav nav-tabs mb-4" id="adminTabs" role="tablist">
      <li class="nav-item">
        <button class="nav-link active" id="users-tab" data-bs-toggle="tab" data-bs-target="#users-panel" type="button">
          <i class="fa-solid fa-users me-1"></i> Utenti
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="posts-tab" data-bs-toggle="tab" data-bs-target="#posts-panel" type="button">
          <i class="fa-solid fa-file-contract me-1"></i> Moderazione Post
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="notify-tab" data-bs-toggle="tab" data-bs-target="#notify-panel" type="button">
          <i class="fa-solid fa-paper-plane me-1"></i> Invio Notifiche
        </button>
      </li>
    </ul>

    <div class="tab-content" id="adminTabsContent">

      <!-- SEZIONE UTENTI -->
      <div class="tab-pane fade show active" id="users-panel" role="tabpanel">
        <div class="hacker-card p-3 mb-4">
          <h5 class="fw-bold mb-3 text-success"><i class="fa-solid fa-user-gear me-2"></i>Gestione Utenti</h5>
          <div id="users-list" class="row g-3"></div>
        </div>
      </div>

      <!-- SEZIONE POST -->
      <div class="tab-pane fade" id="posts-panel" role="tabpanel">
        <div class="hacker-card p-3 mb-4">
          <h5 class="fw-bold mb-2 text-success"><i class="fa-solid fa-triangle-exclamation me-2"></i>Moderazione Post</h5>
          <p class="small text-muted mb-3">> I post eliminati restano sospesi per 7 giorni per eventuale ricorso.</p>
          <div id="posts-list" class="row g-3"></div>
        </div>
      </div>

      <!-- SEZIONE NOTIFICHE -->
      <div class="tab-pane fade" id="notify-panel" role="tabpanel">
        <div class="hacker-card p-4 mb-4">
          <h5 class="fw-bold mb-3 text-success"><i class="fa-solid fa-bullhorn me-2"></i>Invio Notifiche</h5>
          
          <div class="mb-3">
            <label class="form-label fw-bold">Cerca Utente per Notifica Mirata:</label>
            <input type="text" id="notify-user-search" class="form-control mb-2" placeholder="Filtra utenti per nome o ID...">
            
            <label class="form-label fw-bold">Destinatario:</label>
            <select id="notify-target" class="form-select">
              <option value="ALL">📢 TUTTI GLI UTENTI (Broadcast Global)</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Titolo Notifica:</label>
            <input type="text" id="notify-title" class="form-control" placeholder="Es. Avviso di Moderazione">
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Messaggio:</label>
            <textarea id="notify-message" class="form-control" rows="4" placeholder="Scrivi il messaggio..."></textarea>
          </div>

          <button class="btn btn-hacker w-100 py-2 fs-6" id="btn-send-notification">
            <i class="fa-solid fa-paper-plane me-2"></i> INVIA NOTIFICA ORA
          </button>
        </div>
      </div>

    </div>

  </div>

  <!-- MODALE BAN UTENTE -->
  <div class="modal fade" id="banModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content hacker-card">
        <div class="modal-header border-bottom border-secondary">
          <h5 class="modal-title fw-bold text-danger"><i class="fa-solid fa-ban me-2"></i> Blocco Utente</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p id="ban-user-name" class="fw-bold text-success mb-3"></p>
          
          <div class="mb-3">
            <label class="form-label fw-bold">Durata Blocco:</label>
            <select id="ban-duration" class="form-select">
              <option value="24h">24 Ore</option>
              <option value="3d">3 Giorni</option>
              <option value="7d">7 Giorni</option>
              <option value="30d">30 Giorni</option>
              <option value="indefinite">A tempo indeterminato</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Motivazione:</label>
            <textarea id="ban-reason" class="form-control" rows="2" placeholder="Motivo della sospensione..."></textarea>
          </div>
        </div>
        <div class="modal-footer border-top border-secondary">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annulla</button>
          <button type="button" class="btn btn-hacker-danger" id="confirm-ban-btn">CONFERMA BLOCCO</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, push, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Firebase Config (Regole Mode Test)
    const firebaseConfig = {
      apiKey: "AIzaSyDAwgqotGF0BTUGBjxOMseMMfXpBZdAUTI",
      authDomain: "meowmaster-51991.firebaseapp.com",
      databaseURL: "https://meowmaster-51991-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "meowmaster-51991",
      storageBucket: "meowmaster-51991.firebasestorage.app",
      messagingSenderId: "1079993425259",
      appId: "1:1079993425259:web:1aa6a9e5f0a65b6ee4802e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let usersData = {};
    let postsData = [];
    let selectedUserIdForBan = null;
    let banModalInstance = null;

    document.addEventListener('DOMContentLoaded', () => {
      banModalInstance = new bootstrap.Modal(document.getElementById('banModal'));
    });

    // Registrazione Service Worker per la PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW Registration error:', err));
    }

    // Caricamento Utenti in tempo reale
    const usersRef = ref(db, 'users');
    onValue(usersRef, (snapshot) => {
      usersData = snapshot.exists() ? snapshot.val() : {};
      renderUsers();
      updateNotificationTargetList();
    }, (err) => alert("Errore lettura utenti: " + err.message));

    // Caricamento Post in tempo reale
    const postsRef = ref(db, 'cats');
    onValue(postsRef, (snapshot) => {
      postsData = [];
      if (snapshot.exists()) {
        const data = snapshot.val();
        postsData = Object.keys(data).map(key => ({ id: key, ...data[key] }));
      }
      renderPosts();
    }, (err) => alert("Errore lettura post: " + err.message));

    // Renderizza la lista utenti
    function renderUsers(filterQuery = '') {
      const container = document.getElementById('users-list');
      container.innerHTML = '';

      const userKeys = Object.keys(usersData);
      if (userKeys.length === 0) {
        container.innerHTML = `<div class="col-12"><p class="text-muted">Nessun utente trovato.</p></div>`;
        return;
      }

      userKeys.forEach(uid => {
        const u = usersData[uid];
        const username = u.username || u.name || uid;

        if (filterQuery && !username.toLowerCase().includes(filterQuery) && !uid.toLowerCase().includes(filterQuery)) {
          return;
        }

        const isBanned = u.bannedUntil && (u.bannedUntil === 'indefinite' || new Date(u.bannedUntil) > new Date());
        let banBadge = isBanned ? 
          `<span class="badge badge-danger-custom">BLOCCATO</span>` : 
          `<span class="badge badge-hacker">ATTIVO</span>`;

        const col = document.createElement('div');
        col.className = 'col-md-6 col-lg-4';
        col.innerHTML = `
          <div class="hacker-card p-3 h-100 d-flex flex-column justify-content-between">
            <div>
              <div class="d-flex justify-content-between align-items-center mb-2">
                <h6 class="fw-bold mb-0 text-truncate text-white"><i class="fa-solid fa-user text-success me-1"></i> ${username}</h6>
                ${banBadge}
              </div>
              <p class="small text-muted mb-2">ID: ${uid}</p>
              ${u.banReason ? `<p class="small text-danger mb-2">Motivo: ${u.banReason}</p>` : ''}
            </div>
            <div class="mt-3">
              ${isBanned ? `
                <button class="btn btn-hacker btn-sm w-100" onclick="unbanUser('${uid}')">
                  <i class="fa-solid fa-lock-open me-1"></i> SBLOCCA
                </button>
              ` : `
                <button class="btn btn-hacker-danger btn-sm w-100" onclick="openBanModal('${uid}', '${username}')">
                  <i class="fa-solid fa-ban me-1"></i> BLOCCA
                </button>
              `}
            </div>
          </div>
        `;
        container.appendChild(col);
      });
    }

    // Renderizza la lista dei post
    function renderPosts(filterQuery = '') {
      const container = document.getElementById('posts-list');
      container.innerHTML = '';

      if (postsData.length === 0) {
        container.innerHTML = `<div class="col-12"><p class="text-muted">Nessun post trovato.</p></div>`;
        return;
      }

      const now = new Date().getTime();
      const SEVEN_DAYS_MS = 7 * 24 * 60 * 60 * 1000;

      postsData.forEach(post => {
        const catName = post.catName || post.title || 'Senza nome';
        const author = post.author || post.username || 'Anonimo';

        if (filterQuery && !catName.toLowerCase().includes(filterQuery) && !author.toLowerCase().includes(filterQuery)) {
          return;
        }

        const isDeleted = post.deleted === true;
        let appealExpired = false;
        let daysLeftText = '';

        if (isDeleted && post.deletedAt) {
          const deletedTime = new Date(post.deletedAt).getTime();
          const diff = now - deletedTime;
          if (diff > SEVEN_DAYS_MS) {
            appealExpired = true;
          } else {
            const daysLeft = Math.ceil((SEVEN_DAYS_MS - diff) / (1000 * 60 * 60 * 24));
            daysLeftText = `(${daysLeft} gg per ricorso)`;
          }
        }

        const col = document.createElement('div');
        col.className = 'col-md-6 col-lg-4';
        col.innerHTML = `
          <div class="hacker-card p-3 h-100 d-flex flex-column justify-content-between">
            <div>
              <img src="${post.imageUrl || post.image || 'https://via.placeholder.com/300x200?text=No+Image'}" class="post-img-thumb mb-2" alt="${catName}">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <h6 class="fw-bold mb-0 text-white text-truncate">${catName}</h6>
                ${isDeleted ? 
                  (appealExpired ? `<span class="badge bg-secondary">ARCHIVIATO</span>` : `<span class="badge badge-danger-custom">ELIMINATO ${daysLeftText}</span>`) 
                  : `<span class="badge badge-hacker">ONLINE</span>`
                }
              </div>
              <p class="small text-muted mb-1"><i class="fa-solid fa-user me-1"></i> Autore: ${author}</p>
            </div>

            <div class="mt-3">
              ${isDeleted ? `
                ${!appealExpired ? `
                  <button class="btn btn-hacker btn-sm w-100" onclick="restorePost('${post.id}')">
                    <i class="fa-solid fa-rotate-left me-1"></i> RIPRISTINA POST
                  </button>
                ` : `
                  <button class="btn btn-outline-secondary btn-sm w-100" disabled>RICORSO SCADUTO</button>
                `}
              ` : `
                <button class="btn btn-hacker-danger btn-sm w-100" onclick="deletePost('${post.id}')">
                  <i class="fa-solid fa-trash me-1"></i> ELIMINA (RICORSO 7GG)
                </button>
              `}
            </div>
          </div>
        `;
        container.appendChild(col);
      });
    }

    // Modalità Ban Utente
    window.openBanModal = (uid, username) => {
      selectedUserIdForBan = uid;
      document.getElementById('ban-user-name').innerText = `Utente: ${username} (${uid})`;
      document.getElementById('ban-reason').value = '';
      banModalInstance.show();
    };

    document.getElementById('confirm-ban-btn').addEventListener('click', async () => {
      if (!selectedUserIdForBan) return;

      const duration = document.getElementById('ban-duration').value;
      const reason = document.getElementById('ban-reason').value || 'Violazione del regolamento.';
      
      let bannedUntil = 'indefinite';
      if (duration !== 'indefinite') {
        const now = new Date();
        if (duration === '24h') now.setHours(now.getHours() + 24);
        if (duration === '3d') now.setDate(now.getDate() + 3);
        if (duration === '7d') now.setDate(now.getDate() + 7);
        if (duration === '30d') now.setDate(now.getDate() + 30);
        bannedUntil = now.toISOString();
      }

      try {
        await update(ref(db, `users/${selectedUserIdForBan}`), {
          bannedUntil: bannedUntil,
          banReason: reason
        });
        banModalInstance.hide();
        alert('Utente bloccato con successo!');
      } catch (err) {
        alert("Errore blocco: " + err.message);
      }
    });

    window.unbanUser = async (uid) => {
      if (confirm(`Sbloccare l'utente ${uid}?`)) {
        try {
          await update(ref(db, `users/${uid}`), {
            bannedUntil: null,
            banReason: null
          });
          alert('Utente sbloccato.');
        } catch (err) {
          alert("Errore sblocco: " + err.message);
        }
      }
    };

    // Gestione Moderazione Post
    window.deletePost = async (postId) => {
      if (confirm(`Eliminare il post? L'utente avrà 7 giorni per inviare ricorso.`)) {
        try {
          await update(ref(db, `cats/${postId}`), {
            deleted: true,
            deletedAt: new Date().toISOString()
          });
          alert('Post eliminato correttamente.');
        } catch (err) {
          alert("Errore eliminazione: " + err.message);
        }
      }
    };

    window.restorePost = async (postId) => {
      if (confirm(`Ripristinare il post?`)) {
        try {
          await update(ref(db, `cats/${postId}`), {
            deleted: false,
            deletedAt: null
          });
          alert('Post ripristinato.');
        } catch (err) {
          alert("Errore ripristino: " + err.message);
        }
      }
    };

    // Ricerca e Selezione Destinatari Notifiche
    function updateNotificationTargetList(filter = '') {
      const select = document.getElementById('notify-target');
      select.innerHTML = '<option value="ALL">📢 TUTTI GLI UTENTI (Broadcast Global)</option>';
      
      Object.keys(usersData).forEach(uid => {
        const u = usersData[uid];
        const username = u.username || u.name || uid;

        if (filter && !username.toLowerCase().includes(filter) && !uid.toLowerCase().includes(filter)) {
          return;
        }

        const opt = document.createElement('option');
        opt.value = uid;
        opt.textContent = `👤 ${username} (ID: ${uid})`;
        select.appendChild(opt);
      });
    }

    document.getElementById('notify-user-search').addEventListener('input', (e) => {
      updateNotificationTargetList(e.target.value.toLowerCase().trim());
    });

    // SISTEMATO: Invio Notifiche In-App & Innesco FCM
    document.getElementById('btn-send-notification').addEventListener('click', async () => {
      const target = document.getElementById('notify-target').value;
      const title = document.getElementById('notify-title').value.trim();
      const message = document.getElementById('notify-message').value.trim();

      if (!title || !message) {
        alert('Compila sia il titolo che il messaggio.');
        return;
      }

      const notificationPayload = {
        title: title,
        message: message,
        body: message,
        createdAt: new Date().toISOString(),
        read: false,
        target: target
      };

      try {
        if (target === 'ALL') {
          // 1. Scrivi lo storico globale
          await push(ref(db, 'notifications/global'), notificationPayload);
          
          // 2. Se salvato nei profili utente, crea una coda per invio FCM
          await push(ref(db, 'fcm_queue'), {
            ...notificationPayload,
            type: 'broadcast'
          });
        } else {
          // 1. Scrivi la notifica diretta per l'utente specifico
          await push(ref(db, `notifications/direct/${target}`), notificationPayload);
          
          // 2. Aggiungi il token se disponibile nel profilo utente
          const userObj = usersData[target];
          if (userObj && userObj.fcmToken) {
            notificationPayload.fcmToken = userObj.fcmToken;
          }

          // 3. Coda di invio
          await push(ref(db, 'fcm_queue'), {
            ...notificationPayload,
            type: 'direct'
          });
        }

        alert('Notifica inviata con successo!');
        document.getElementById('notify-title').value = '';
        document.getElementById('notify-message').value = '';
      } catch (err) {
        alert('Errore durante l\'invio della notifica: ' + err.message);
      }
    });

    // Filtro Ricerca Globale
    document.getElementById('global-search').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      renderUsers(q);
      renderPosts(q);
    });
  </script>
</body>
</html>
