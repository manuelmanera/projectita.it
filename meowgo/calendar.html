<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeowGo - Calendario 🐾</title>

  <!-- PWA Manifest & Icone Mobile -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#b45309">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="./icons/icon-512.png">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      background: linear-gradient(135deg, #f5f0eb 0%, #e6d5c3 50%, #d4a373 100%);
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #3d312a;
    }

    .glass-card {
      background: rgba(255, 253, 250, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(210, 180, 140, 0.4);
      border-radius: 1.5rem;
      box-shadow: 0 10px 30px rgba(80, 50, 20, 0.1);
    }

    /* Navbar Sticky per Mobile e Desktop */
    .navbar-glass {
      background: rgba(255, 253, 250, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(210, 180, 140, 0.3);
      position: sticky;
      top: 0;
      z-index: 1030;
      transition: transform 0.3s ease-in-out;
      will-change: transform;
    }

    .navbar-hidden {
      transform: translateY(-100%);
    }

    .btn-earth {
      background: linear-gradient(45deg, #88502f, #b45309);
      color: white;
      border: none;
    }
    .btn-earth:hover {
      background: linear-gradient(45deg, #6e3f23, #92400e);
      color: white;
    }

    /* Griglia Calendario */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .calendar-day-header {
      text-align: center;
      font-weight: bold;
      font-size: 0.85rem;
      color: #8c7a6b;
      padding: 6px 0;
    }

    .calendar-day-cell {
      aspect-ratio: 1;
      border-radius: 0.75rem;
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(210, 180, 140, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 4px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .calendar-day-cell:hover {
      background: rgba(255, 255, 255, 0.95);
      border-color: #b45309;
    }

    .calendar-day-cell.empty {
      background: transparent;
      border: none;
      cursor: default;
    }

    .calendar-day-cell.today {
      border: 2px solid #b45309;
      font-weight: bold;
    }

    .calendar-day-cell.has-events {
      background: #fef3c7;
      border-color: #f59e0b;
    }

    .event-badge {
      background: #b45309;
      color: white;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 0.65rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body class="pb-5">
  <script>
    if (!localStorage.getItem('meowgo_test_user')) location.replace('index.html');
  </script>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light navbar-glass mb-4">
    <div class="container">
      <a class="navbar-brand fw-black fs-3 text-dark d-flex align-items-center gap-2" href="feed.html">
        <i class="fa-solid fa-cat" style="color: #b45309;"></i> MeowGo
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto gap-2 mt-2 mt-lg-0" id="nav-links"></ul>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        
        <div class="glass-card p-4 mb-4">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <button class="btn btn-earth btn-sm rounded-circle px-3" id="prev-month">
              <i class="fa-solid fa-chevron-left"></i>
            </button>
            <h4 class="fw-bold mb-0 text-dark" id="current-month-display">---</h4>
            <button class="btn btn-earth btn-sm rounded-circle px-3" id="next-month">
              <i class="fa-solid fa-chevron-right"></i>
            </button>
          </div>

          <div class="calendar-grid mb-2">
            <div class="calendar-day-header">Lun</div>
            <div class="calendar-day-header">Mar</div>
            <div class="calendar-day-header">Mer</div>
            <div class="calendar-day-header">Gio</div>
            <div class="calendar-day-header">Ven</div>
            <div class="calendar-day-header">Sab</div>
            <div class="calendar-day-header">Dom</div>
          </div>

          <div class="calendar-grid" id="calendar-days-grid"></div>
        </div>

        <div class="glass-card p-4">
          <h5 class="fw-bold mb-3 text-dark" id="selected-date-title">
            <i class="fa-solid fa-calendar-day me-2" style="color: #b45309;"></i>Seleziona un giorno
          </h5>
          <div id="day-events-container" class="d-flex flex-column gap-3">
            <p class="text-muted small mb-0">Clicca su una data nel calendario per visualizzare gli avvistamenti associati.</p>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDAwgqotGF0BTUGBjxOMseMMfXpBZdAUTI",
      authDomain: "meowmaster-51991.firebaseapp.com",
      databaseURL: "https://meowmaster-51991-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "meowmaster-51991",
      storageBucket: "meowmaster-51991.firebasestorage.app",
      messagingSenderId: "1079993425259",
      appId: "1:1079993425259:web:1aa6a9e5f0a65b6ee4802e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    function getCurrentUser() {
      return JSON.parse(localStorage.getItem('meowgo_test_user')) || null;
    }
    function clearCurrentUser() {
      localStorage.removeItem('meowgo_test_user');
    }

    function renderNavbar() {
      const currentUser = getCurrentUser();
      const navLinks = document.getElementById('nav-links');

      if (currentUser) {
        navLinks.innerHTML = `
          <li class="nav-item"><a class="nav-link fw-bold text-dark" href="feed.html"><i class="fa-solid fa-newspaper"></i> Feed</a></li>
          <li class="nav-item"><a class="nav-link fw-bold text-success" href="garden.html"><i class="fa-solid fa-tree"></i> MeowGarden</a></li>
          <li class="nav-item"><a class="nav-link fw-bold text-dark" href="profile.html"><i class="fa-solid fa-user"></i> Profilo (${currentUser.username})</a></li>
          <li class="nav-item"><a class="nav-link fw-bold text-danger" href="#" id="logout-link"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
        `;
        document.getElementById('logout-link')?.addEventListener('click', (e) => {
          e.preventDefault();
          clearCurrentUser();
          window.location.href = 'index.html';
        });
      } else {
        window.location.replace('index.html');
      }
    }

    renderNavbar();

    let currentDate = new Date();
    let postsData = [];

    const monthNames = [
      "Gennaio", "Febbraio", "Marzo", "Aprile", "Maggio", "Giugno",
      "Luglio", "Agosto", "Settembre", "Ottobre", "Novembre", "Dicembre"
    ];

    const catsRef = ref(db, 'cats');
    onValue(catsRef, (snapshot) => {
      postsData = [];
      if (snapshot.exists()) {
        const data = snapshot.val();
        postsData = Object.keys(data).map(key => ({ id: key, ...data[key] }));
      }
      renderCalendar();
    });

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      document.getElementById('current-month-display').innerText = `${monthNames[month]} ${year}`;

      const grid = document.getElementById('calendar-days-grid');
      grid.innerHTML = '';

      const firstDayOfMonth = new Date(year, month, 1);
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      let startingDay = firstDayOfMonth.getDay() - 1;
      if (startingDay === -1) startingDay = 6; 

      for (let i = 0; i < startingDay; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'calendar-day-cell empty';
        grid.appendChild(emptyCell);
      }

      const today = new Date();

      for (let day = 1; day <= daysInMonth; day++) {
        const cell = document.createElement('div');
        cell.className = 'calendar-day-cell';

        if (day === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
          cell.classList.add('today');
        }

        const dateStr = `${String(day).padStart(2, '0')}/${String(month + 1).padStart(2, '0')}/${year}`;

        const eventsOnDay = postsData.filter(post => {
          if (post.date) return post.date === dateStr;
          if (post.createdAt) {
            const d = new Date(post.createdAt);
            const postDateStr = `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
            return postDateStr === dateStr;
          }
          return false;
        });

        cell.innerHTML = `<span>${day}</span>`;

        if (eventsOnDay.length > 0) {
          cell.classList.add('has-events');
          cell.innerHTML += `<span class="event-badge">${eventsOnDay.length}</span>`;
        }

        cell.addEventListener('click', () => showDayEvents(dateStr, eventsOnDay));
        grid.appendChild(cell);
      }
    }

    function showDayEvents(dateStr, events) {
      const title = document.getElementById('selected-date-title');
      const container = document.getElementById('day-events-container');

      title.innerHTML = `<i class="fa-solid fa-calendar-day me-2" style="color: #b45309;"></i>Avvistamenti del ${dateStr}`;
      container.innerHTML = '';

      if (events.length === 0) {
        container.innerHTML = `<p class="text-muted small mb-0">Nessun avvistamento registrato in questa data.</p>`;
        return;
      }

      events.forEach(post => {
        const div = document.createElement('div');
        div.className = "d-flex align-items-center gap-3 p-2 rounded bg-white border";
        div.innerHTML = `
          <img src="${post.imageUrl}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 8px;" alt="${post.catName}">
          <div>
            <h6 class="fw-bold mb-0 text-dark">${post.catName}</h6>
            <small class="text-muted"><i class="fa-solid fa-user me-1"></i>${post.author} - ${post.time || ''}</small>
          </div>
        `;
        container.appendChild(div);
      });
    }

    document.getElementById('prev-month').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    });

    document.getElementById('next-month').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    });
  </script>

  <!-- Script Mobile-Optimized per nascondere/mostrare la Navbar -->
  <script>
    let lastScrollTop = 0;
    const navbar = document.querySelector('.navbar');
    const delta = 10;

    window.addEventListener('scroll', () => {
      let scrollTop = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop;
      let bodyHeight = document.documentElement.scrollHeight;
      let windowHeight = window.innerHeight;

      if (scrollTop <= 0 || scrollTop + windowHeight >= bodyHeight) {
        navbar.classList.remove('navbar-hidden');
        return;
      }

      if (Math.abs(lastScrollTop - scrollTop) <= delta) return;

      if (scrollTop > lastScrollTop && scrollTop > 60) {
        navbar.classList.add('navbar-hidden');
      } else {
        navbar.classList.remove('navbar-hidden');
      }

      lastScrollTop = scrollTop;
    }, { passive: true });
  </script>
</body>
</html>
