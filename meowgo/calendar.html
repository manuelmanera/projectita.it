<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeowGo - Calendario 🐾</title>

  <!-- PWA Manifest & Icone Mobile -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#b45309">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="./icons/icon-512.png">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      background: linear-gradient(135deg, #f5f0eb 0%, #e6d5c3 50%, #d4a373 100%);
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      color: #3d312a;
    }

    .glass-card {
      background: rgba(255, 253, 250, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(210, 180, 140, 0.4);
      border-radius: 1.5rem;
      box-shadow: 0 10px 30px rgba(80, 50, 20, 0.1);
    }

    .navbar-glass {
      background: rgba(255, 253, 250, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(210, 180, 140, 0.3);
    }

    .cat-post-img {
      width: 100%; 
      height: 320px;
      object-fit: cover;
    }

    .btn-like { color: #8c7a6b; transition: transform 0.2s; }
    .btn-like.liked { color: #dc2626; transform: scale(1.1); }

    .btn-earth {
      background: linear-gradient(45deg, #88502f, #b45309);
      color: white;
      border: none;
    }
    .btn-earth:hover {
      background: linear-gradient(45deg, #6e3f23, #92400e);
      color: white;
    }

    /* Styles Specifici Calendario */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .calendar-day-header {
      text-align: center;
      font-weight: 700;
      font-size: 0.85rem;
      color: #8c7a6b;
      padding-bottom: 6px;
      text-transform: uppercase;
    }

    .calendar-day {
      aspect-ratio: 1;
      border-radius: 1rem;
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(210, 180, 140, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
      user-select: none;
      color: #3d312a;
    }

    .calendar-day:hover:not(.empty) {
      background: rgba(255, 255, 255, 0.95);
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(180, 83, 9, 0.15);
    }

    .calendar-day.empty {
      background: transparent;
      border: none;
      cursor: default;
    }

    .calendar-day.today {
      border: 2px solid #d97706;
      font-weight: 800;
    }

    .calendar-day.selected {
      background: linear-gradient(45deg, #b45309, #d97706) !important;
      color: white !important;
      box-shadow: 0 4px 12px rgba(180, 83, 9, 0.35);
    }

    .calendar-day.selected .post-dot {
      background-color: #ffffff !important;
    }

    .post-badge {
      position: absolute;
      bottom: 6px;
      display: flex;
      gap: 2px;
      align-items: center;
      justify-content: center;
    }

    .post-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #b45309;
    }

    .post-count-badge {
      font-size: 0.65rem;
      background: #b45309;
      color: white;
      border-radius: 10px;
      padding: 1px 5px;
      margin-top: 2px;
    }
  </style>
</head>
<body class="pb-5">
  <script>
    if (!localStorage.getItem('meowgo_test_user')) location.replace('index.html');
  </script>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light sticky-top navbar-glass mb-4 position-relative z-3">
    <div class="container">
      <a class="navbar-brand fw-black fs-3 text-dark d-flex align-items-center gap-2" href="feed.html">
        <i class="fa-solid fa-cat" style="color: #b45309;"></i> MeowGo
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto gap-2 mt-2 mt-lg-0" id="nav-links"></ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container position-relative z-1">
    <div class="row justify-content-center g-4">
      
      <!-- Sezione Calendario -->
      <div class="col-lg-5 col-md-6">
        <div class="glass-card p-3 p-md-4">
          <!-- Header Mese -->
          <div class="d-flex justify-content-between align-items-center mb-4">
            <button class="btn btn-sm btn-outline-secondary rounded-circle" id="prev-month">
              <i class="fa-solid fa-chevron-left"></i>
            </button>
            <h4 class="fw-bold mb-0 text-dark text-capitalize" id="month-year-label"></h4>
            <button class="btn btn-sm btn-outline-secondary rounded-circle" id="next-month">
              <i class="fa-solid fa-chevron-right"></i>
            </button>
          </div>

          <!-- Header Giorni della Settimana -->
          <div class="calendar-grid mb-2">
            <div class="calendar-day-header">Lun</div>
            <div class="calendar-day-header">Mar</div>
            <div class="calendar-day-header">Mer</div>
            <div class="calendar-day-header">Gio</div>
            <div class="calendar-day-header">Ven</div>
            <div class="calendar-day-header">Sab</div>
            <div class="calendar-day-header">Dom</div>
          </div>

          <!-- Griglia Giorni del Mese -->
          <div class="calendar-grid" id="calendar-days"></div>
        </div>
      </div>

      <!-- Sezione Post per Data -->
      <div class="col-lg-6 col-md-6">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4 class="fw-bold mb-0 text-dark">
            <i class="fa-regular fa-calendar-check" style="color: #b45309;"></i> 
            <span id="selected-date-title">Post del giorno</span>
          </h4>
        </div>
        <div id="posts-container" class="d-flex flex-column gap-4">
          <div class="glass-card p-4 text-center text-muted">
            <i class="fa-solid fa-cat fs-1 mb-2 opacity-50"></i>
            <p class="mb-0">Seleziona una data sul calendario per caricare gli avvistamenti.</p>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
      getDatabase, ref, get, update, onValue
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDAwgqotGF0BTUGBjxOMseMMfXpBZdAUTI",
      authDomain: "meowmaster-51991.firebaseapp.com",
      databaseURL: "https://meowmaster-51991-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "meowmaster-51991",
      storageBucket: "meowmaster-51991.firebasestorage.app",
      messagingSenderId: "1079993425259",
      appId: "1:1079993425259:web:1aa6a9e5f0a65b6ee4802e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Gestione Utente
    function getCurrentUser() {
      return JSON.parse(localStorage.getItem('meowgo_test_user')) || null;
    }
    function clearCurrentUser() {
      localStorage.removeItem('meowgo_test_user');
    }

    function renderNavbar(activePage) {
      const currentUser = getCurrentUser();
      const navLinks = document.getElementById('nav-links');

      if (currentUser) {
        navLinks.innerHTML = `
          <li class="nav-item"><a class="nav-link fw-bold ${activePage === 'feed' ? 'text-warning' : 'text-dark'}" href="feed.html"><i class="fa-solid fa-newspaper"></i> Feed</a></li>
          <li class="nav-item"><a class="nav-link fw-bold ${activePage === 'calendar' ? 'text-warning' : 'text-dark'}" href="calendar.html"><i class="fa-solid fa-calendar-days"></i> Calendario</a></li>
          <li class="nav-item"><a class="nav-link fw-bold ${activePage === 'garden' ? 'text-warning' : 'text-success'}" href="garden.html"><i class="fa-solid fa-tree"></i> MeowGarden</a></li>
          <li class="nav-item"><a class="nav-link fw-bold ${activePage === 'profile' ? 'text-warning' : 'text-dark'}" href="profile.html"><i class="fa-solid fa-user"></i> Profilo (${currentUser.username})</a></li>
          <li class="nav-item"><a class="nav-link fw-bold text-danger" href="#" id="logout-link"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
        `;
        const logoutLink = document.getElementById('logout-link');
        if (logoutLink) {
          logoutLink.addEventListener('click', (e) => {
            e.preventDefault();
            clearCurrentUser();
            window.location.href = 'index.html';
          });
        }
      } else {
        window.location.replace('index.html');
      }
      return currentUser;
    }

    const currentUser = renderNavbar('calendar');

    // Stato del Calendario
    let currentDate = new Date();
    let selectedDateKey = formatDateKey(new Date());
    let allPosts = [];

    // Helper: Formattazione data "YYYY-MM-DD" per chiavi uniche
    function formatDateKey(dateObj) {
      const year = dateObj.getFullYear();
      const month = String(dateObj.getMonth() + 1).padStart(2, '0');
      const day = String(dateObj.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    // Normalizza la data di un post nel formato standard "YYYY-MM-DD"
    function getPostDateKey(post) {
      if (post.date) {
        if (post.date.includes('-')) {
          return post.date; // Presume YYYY-MM-DD
        } else if (post.date.includes('/')) {
          const parts = post.date.split('/');
          if (parts.length === 3) {
            return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
          }
        }
      }
      if (post.createdAt) {
        const d = new Date(post.createdAt);
        return formatDateKey(d);
      }
      return null;
    }

    // Formatta orario/data per la visualizzazione nella card del post
    function formatPostTimestamp(post) {
      if (post.time) return post.time;
      if (post.createdAt) {
        const d = new Date(post.createdAt);
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }
      return '';
    }

    // Ascolto in tempo reale dei Post da Firebase
    if (currentUser) {
      const catsRef = ref(db, 'cats');
      onValue(catsRef, (snapshot) => {
        allPosts = [];
        if (snapshot.exists()) {
          const data = snapshot.val();
          allPosts = Object.keys(data).map(key => ({ id: key, ...data[key] })).reverse();
        }
        renderCalendar();
        renderPostsForSelectedDate();
      });
    }

    // Rendering Calendario
    function renderCalendar() {
      const monthYearLabel = document.getElementById('month-year-label');
      const calendarDays = document.getElementById('calendar-days');
      
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      // Intestazione Mese e Anno
      monthYearLabel.textContent = currentDate.toLocaleDateString('it-IT', { month: 'long', year: 'numeric' });

      calendarDays.innerHTML = '';

      // Mappa dei post per giorno per il mese corrente
      const postsCountByDay = {};
      allPosts.forEach(post => {
        const dateKey = getPostDateKey(post);
        if (dateKey) {
          postsCountByDay[dateKey] = (postsCountByDay[dateKey] || 0) + 1;
        }
      });

      // Primo e ultimo giorno del mese
      const firstDayOfMonth = new Date(year, month, 1);
      const lastDayOfMonth = new Date(year, month + 1, 0);

      // Calcola offset giorno della settimana (Lunedì = 0, Domenica = 6)
      let startingDay = firstDayOfMonth.getDay() - 1;
      if (startingDay === -1) startingDay = 6; 

      // Celle Vuote Mese Precedente
      for (let i = 0; i < startingDay; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'calendar-day empty';
        calendarDays.appendChild(emptyCell);
      }

      // Giorni del Mese
      const totalDays = lastDayOfMonth.getDate();
      const todayKey = formatDateKey(new Date());

      for (let day = 1; day <= totalDays; day++) {
        const dayObj = new Date(year, month, day);
        const dayKey = formatDateKey(dayObj);
        const count = postsCountByDay[dayKey] || 0;

        const dayCell = document.createElement('div');
        dayCell.className = 'calendar-day';
        if (dayKey === todayKey) dayCell.classList.add('today');
        if (dayKey === selectedDateKey) dayCell.classList.add('selected');

        dayCell.innerHTML = `<span>${day}</span>`;

        // Badge se ci sono post
        if (count > 0) {
          const badge = document.createElement('div');
          badge.className = 'post-badge';
          if (count === 1) {
            badge.innerHTML = `<div class="post-dot"></div>`;
          } else {
            badge.innerHTML = `<span class="post-count-badge">${count}</span>`;
          }
          dayCell.appendChild(badge);
        }

        // Selezione Data
        dayCell.addEventListener('click', () => {
          selectedDateKey = dayKey;
          document.querySelectorAll('.calendar-day').forEach(el => el.classList.remove('selected'));
          dayCell.classList.add('selected');
          renderPostsForSelectedDate();
        });

        calendarDays.appendChild(dayCell);
      }
    }

    // Renderizza i post della data selezionata
    function renderPostsForSelectedDate() {
      const container = document.getElementById('posts-container');
      const title = document.getElementById('selected-date-title');

      // Formatta titolo data selezionata
      const [y, m, d] = selectedDateKey.split('-');
      const formattedDateObj = new Date(y, m - 1, d);
      title.textContent = formattedDateObj.toLocaleDateString('it-IT', { day: 'numeric', month: 'long', year: 'numeric' });

      // Filtra post della data
      const postsForDay = allPosts.filter(p => getPostDateKey(p) === selectedDateKey);

      container.innerHTML = '';

      if (postsForDay.length === 0) {
        container.innerHTML = `
          <div class="glass-card p-4 text-center text-muted">
            <i class="fa-solid fa-cat fs-1 mb-2 opacity-50"></i>
            <p class="mb-0">Nessun avvistamento registrato in questa data.</p>
          </div>
        `;
        return;
      }

      postsForDay.forEach(post => {
        const likesMap = post.likes || {};
        const likesCount = Object.keys(likesMap).length;
        const isLiked = currentUser && likesMap[currentUser.id];
        const timeStr = formatPostTimestamp(post);

        const card = document.createElement('div');
        card.className = "glass-card overflow-hidden";
        card.innerHTML = `
          <div class="p-3 d-flex align-items-center gap-2 border-bottom">
            <div class="fw-bold text-dark"><i class="fa-solid fa-circle-user text-warning"></i> ${post.author}</div>
            <span class="small text-muted ms-auto"><i class="fa-regular fa-clock me-1"></i>${timeStr}</span>
          </div>
          <img src="${post.imageUrl}" class="cat-post-img" alt="${post.catName}">
          <div class="p-3">
            <div class="d-flex align-items-center gap-3 mb-2">
              <button class="btn btn-link p-0 text-decoration-none btn-like fs-4 ${isLiked ? 'liked' : ''}" onclick="toggleLike('${post.id}')">
                <i class="${isLiked ? 'fa-solid' : 'fa-regular'} fa-heart"></i>
              </button>
              <span class="fw-bold text-dark">${likesCount} Mi piace</span>
            </div>
            <h5 class="fw-bold text-dark mb-0">${post.catName}</h5>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Toggle Mese Precedente / Successivo
    document.getElementById('prev-month').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    });

    document.getElementById('next-month').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    });

    // Toggle Like
    window.toggleLike = async function (postId) {
      if (!currentUser) return;
      const likeRef = ref(db, `cats/${postId}/likes/${currentUser.id}`);
      const snap = await get(likeRef);
      if (snap.exists()) {
        await update(ref(db, `cats/${postId}/likes`), { [currentUser.id]: null });
      } else {
        await update(ref(db, `cats/${postId}/likes`), { [currentUser.id]: true });
      }
    };
  </script>

  <!-- Service Workers -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.error(err));
        navigator.serviceWorker.register('./firebase-messaging-sw.js', { scope: './' }).catch(err => console.error(err));
      });
    }
  </script>
</body>
</html>
