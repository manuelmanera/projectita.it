<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeowGo - Feed 🐾</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      background: linear-gradient(135deg, #f5f0eb 0%, #e6d5c3 50%, #d4a373 100%);
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      color: #3d312a;
    }

    #garden-container-box {
      width: 100%;
      max-width: 450px;
      aspect-ratio: 9 / 16;
      margin: 0 auto;
      position: relative;
      background-image: url('https://i.ibb.co/93HyWQJ1/1784837930021.jpg');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      border: 8px solid #3d2314;
      border-radius: 1.5rem;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
    }

    #cats-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    .glass-card {
      background: rgba(255, 253, 250, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(210, 180, 140, 0.4);
      border-radius: 1.5rem;
      box-shadow: 0 10px 30px rgba(80, 50, 20, 0.1);
    }

    .navbar-glass {
      background: rgba(255, 253, 250, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(210, 180, 140, 0.3);
    }

    .avatar-circle {
      width: 70px; height: 70px;
      background: linear-gradient(45deg, #d97706, #b45309);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.2rem;
      border: 3px solid #fff;
      color: white;
    }

    .cat-post-img {
      width: 100%; height: 350px;
      object-fit: cover;
    }

    .page-section { display: none; }
    .page-section.active { display: block; animation: fadeIn 0.3s ease-in-out; }

    .btn-like { color: #8c7a6b; transition: transform 0.2s; }
    .btn-like.liked { color: #dc2626; transform: scale(1.1); }

    .auth-toggle-btn { cursor: pointer; color: #b45309; font-weight: bold; text-decoration: underline; }

    .badge-card {
      background: rgba(245, 238, 230, 0.8);
      border-radius: 1rem;
      padding: 8px 4px;
      text-align: center;
      border: 2px solid transparent;
      transition: all 0.3s ease;
      filter: grayscale(100%);
      opacity: 0.35;
    }

    .badge-card.unlocked {
      filter: grayscale(0%);
      opacity: 1;
      background: #fff;
      border-color: #f59e0b;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
    }

    .secret-badge-col { display: none; }

    .secret-badge-col.unlocked {
      display: block;
      animation: popIn 0.4s ease-out;
    }

    .secret-badge-col.unlocked .badge-card {
      filter: grayscale(0%);
      opacity: 1;
      background: #fffbeb;
      border-color: #b45309;
      box-shadow: 0 4px 12px rgba(180, 83, 9, 0.3);
    }

    .badge-icon {
      font-size: 1.6rem;
      margin-bottom: 2px;
    }

    .btn-earth {
      background: linear-gradient(45deg, #88502f, #b45309);
      color: white;
      border: none;
    }
    .btn-earth:hover {
      background: linear-gradient(45deg, #6e3f23, #92400e);
      color: white;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body class="pb-5">
  <script>
    if (!localStorage.getItem('meowgo_test_user')) location.replace('index.html');
  </script>

  <nav class="navbar navbar-expand-lg navbar-light sticky-top navbar-glass mb-4 position-relative z-3">
    <div class="container">
      <a class="navbar-brand fw-black fs-3 text-dark d-flex align-items-center gap-2" href="feed.html">
        <i class="fa-solid fa-cat" style="color: #b45309;"></i> MeowGo
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto gap-2 mt-2 mt-lg-0" id="nav-links"></ul>
      </div>
    </div>
  </nav>

  <div class="container position-relative z-1">
    <section id="feed-page" class="page-section active">
      <div class="row justify-content-center">
        <div class="col-lg-7">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold mb-0 text-dark"><i class="fa-solid fa-earth-americas" style="color: #b45309;"></i> Community Feed</h3>
            <a href="profile.html" class="btn btn-earth rounded-pill fw-bold btn-sm shadow-sm">
              <i class="fa-solid fa-plus"></i> Nuovo Avvistamento
            </a>
          </div>
          <div id="feed-container" class="d-flex flex-column gap-4"></div>
        </div>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
      getDatabase, ref, push, get, child, update, onValue
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const IMGBB_API_KEY = "b2bd2cbba6ca0679055dc317aa5bf613";

    const firebaseConfig = {
      apiKey: "AIzaSyDAwgqotGF0BTUGBjxOMseMMfXpBZdAUTI",
      authDomain: "meowmaster-51991.firebaseapp.com",
      databaseURL: "https://meowmaster-51991-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "meowmaster-51991",
      storageBucket: "meowmaster-51991.firebasestorage.app",
      messagingSenderId: "1079993425259",
      appId: "1:1079993425259:web:1aa6a9e5f0a65b6ee4802e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    function getCurrentUser() {
      return JSON.parse(localStorage.getItem('meowgo_test_user')) || null;
    }
    function setCurrentUser(user) {
      localStorage.setItem('meowgo_test_user', JSON.stringify(user));
    }
    function clearCurrentUser() {
      localStorage.removeItem('meowgo_test_user');
    }

    function renderNavbar(activePage, requireAuth = true) {
      const currentUser = getCurrentUser();
      const navLinks = document.getElementById('nav-links');

      if (currentUser) {
        navLinks.innerHTML = `
          <li class="nav-item"><a class="nav-link fw-bold ${activePage === 'feed' ? 'text-warning' : 'text-dark'}" href="feed.html"><i class="fa-solid fa-newspaper"></i> Feed</a></li>
          <li class="nav-item"><a class="nav-link fw-bold ${activePage === 'garden' ? 'text-warning' : 'text-success'}" href="garden.html"><i class="fa-solid fa-tree"></i> MeowGarden</a></li>
          <li class="nav-item"><a class="nav-link fw-bold ${activePage === 'profile' ? 'text-warning' : 'text-dark'}" href="profile.html"><i class="fa-solid fa-user"></i> Profilo (${currentUser.username})</a></li>
          <li class="nav-item"><a class="nav-link fw-bold text-danger" href="#" id="logout-link"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
        `;
        const logoutLink = document.getElementById('logout-link');
        if (logoutLink) {
          logoutLink.addEventListener('click', (e) => {
            e.preventDefault();
            clearCurrentUser();
            window.location.href = 'index.html';
          });
        }
      } else {
        navLinks.innerHTML = `
          <li class="nav-item"><a class="nav-link fw-bold text-dark" href="index.html"><i class="fa-solid fa-right-to-bracket"></i> Accedi</a></li>
        `;
        if (requireAuth && activePage !== 'login') {
          window.location.replace('index.html');
        }
      }

      return currentUser;
    }

    const currentUser = renderNavbar('feed');

    if (currentUser) {
      listenToFeed();
    }

    // Helper per formattare Data e Ora
    function formatPostTimestamp(post) {
      if (post.date && post.time) {
        return `${post.date} - ${post.time}`;
      } else if (post.createdAt) {
        const d = new Date(post.createdAt);
        return `${d.toLocaleDateString('it-IT')} - ${d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
      } else {
        return post.time || '';
      }
    }

    function listenToFeed() {
      const catsRef = ref(db, 'cats');
      onValue(catsRef, (snapshot) => {
        const container = document.getElementById('feed-container');
        container.innerHTML = '';

        if (snapshot.exists()) {
          const data = snapshot.val();
          const catList = Object.keys(data).map(key => ({ id: key, ...data[key] })).reverse();

          catList.forEach((post) => {
            const likesMap = post.likes || {};
            const likesCount = Object.keys(likesMap).length;
            const isLiked = currentUser && likesMap[currentUser.id];
            const dateTimeStr = formatPostTimestamp(post);

            const card = document.createElement('div');
            card.className = "glass-card overflow-hidden";
            card.innerHTML = `
              <div class="p-3 d-flex align-items-center gap-2 border-bottom">
                <div class="fw-bold text-dark"><i class="fa-solid fa-circle-user text-warning"></i> ${post.author}</div>
                <span class="small text-muted ms-auto"><i class="fa-regular fa-calendar-days me-1"></i>${dateTimeStr}</span>
              </div>
              <img src="${post.imageUrl}" class="cat-post-img" alt="${post.catName}">
              <div class="p-3">
                <div class="d-flex align-items-center gap-3 mb-2">
                  <button class="btn btn-link p-0 text-decoration-none btn-like fs-4 ${isLiked ? 'liked' : ''}" onclick="toggleLike('${post.id}')">
                    <i class="${isLiked ? 'fa-solid' : 'fa-regular'} fa-heart"></i>
                  </button>
                  <span class="fw-bold text-dark">${likesCount} Mi piace</span>
                </div>
                <h5 class="fw-bold text-dark mb-0">${post.catName}</h5>
              </div>
            `;
            container.appendChild(card);
          });
        }
      });
    }

    window.toggleLike = async function (postId) {
      if (!currentUser) return;
      const likeRef = ref(db, `cats/${postId}/likes/${currentUser.id}`);
      const snap = await get(likeRef);
      if (snap.exists()) {
        await update(ref(db, `cats/${postId}/likes`), { [currentUser.id]: null });
      } else {
        await update(ref(db, `cats/${postId}/likes`), { [currentUser.id]: true });
      }
    };
  </script>
</body>
</html>
