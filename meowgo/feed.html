<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeowGo - Feed 🐾</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#b45309">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="./icons/icon-512.png">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      background: linear-gradient(135deg, #f5f0eb 0%, #e6d5c3 50%, #d4a373 100%);
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      color: #3d312a;
    }

    .glass-card {
      background: rgba(255, 253, 250, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(210, 180, 140, 0.4);
      border-radius: 1.5rem;
      box-shadow: 0 10px 30px rgba(80, 50, 20, 0.1);
    }

    .navbar-glass {
      background: rgba(255, 253, 250, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(210, 180, 140, 0.3);
      position: sticky;
      top: 0;
      z-index: 1030;
    }

    .cat-post-img {
      width: 100%;
      height: 350px;
      object-fit: cover;
    }

    .btn-like { color: #8c7a6b; transition: transform 0.2s; }
    .btn-like.liked { color: #dc2626; transform: scale(1.1); }

    .btn-earth {
      background: linear-gradient(45deg, #88502f, #b45309);
      color: white;
      border: none;
    }
    .btn-earth:hover {
      background: linear-gradient(45deg, #6e3f23, #92400e);
      color: white;
    }

    .icon-btn-action {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .icon-btn-action:hover {
      transform: scale(1.08);
      box-shadow: 0 4px 12px rgba(180, 83, 9, 0.3);
    }
  </style>
</head>
<body class="pb-5">
  <script>
    if (!localStorage.getItem('meowgo_test_user')) location.replace('index.html');
  </script>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light navbar-glass mb-4">
    <div class="container">
      <a class="navbar-brand fw-black fs-3 text-dark d-flex align-items-center gap-2" href="feed.html">
        <i class="fa-solid fa-cat" style="color: #b45309;"></i> MeowGo
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto gap-2 mt-2 mt-lg-0" id="nav-links"></ul>
      </div>
    </div>
  </nav>

  <div class="container position-relative z-1">
    <section id="feed-page" class="page-section active">
      <div class="row justify-content-center">
        <div class="col-lg-7">
          
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold mb-0 text-dark">
              <i class="fa-solid fa-earth-americas" style="color: #b45309;"></i> Community Feed
            </h3>
            
            <div class="d-flex align-items-center gap-2">
              <a href="search.html" class="btn btn-earth icon-btn-action shadow-sm" title="Cerca Utenti">
                <i class="fa-solid fa-magnifying-glass"></i>
              </a>
              <a href="profile.html" class="btn btn-earth icon-btn-action shadow-sm" title="Nuovo Avvistamento">
                <i class="fa-solid fa-plus"></i>
              </a>
              <a href="calendar.html" class="btn btn-earth icon-btn-action shadow-sm" title="Calendario">
                <i class="fa-solid fa-calendar-days"></i>
              </a>
            </div>
          </div>

          <!-- NESSUN CONTAINER NOTIFICHE VISIBILE IN APP -->

          <div id="feed-container" class="d-flex flex-column gap-4"></div>
        </div>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDAwgqotGF0BTUGBjxOMseMMfXpBZdAUTI",
      authDomain: "meowmaster-51991.firebaseapp.com",
      databaseURL: "https://meowmaster-51991-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "meowmaster-51991",
      storageBucket: "meowmaster-51991.firebasestorage.app",
      messagingSenderId: "1079993425259",
      appId: "1:1079993425259:web:1aa6a9e5f0a65b6ee4802e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    function getCurrentUser() {
      return JSON.parse(localStorage.getItem('meowgo_test_user')) || null;
    }
    function clearCurrentUser() {
      localStorage.removeItem('meowgo_test_user');
    }

    function renderNavbar(activePage) {
      const currentUser = getCurrentUser();
      const navLinks = document.getElementById('nav-links');

      if (currentUser) {
        navLinks.innerHTML = `
          <li class="nav-item"><a class="nav-link fw-bold ${activePage === 'feed' ? 'text-warning' : 'text-dark'}" href="feed.html"><i class="fa-solid fa-newspaper"></i> Feed</a></li>
          <li class="nav-item"><a class="nav-link fw-bold ${activePage === 'garden' ? 'text-warning' : 'text-success'}" href="garden.html"><i class="fa-solid fa-tree"></i> MeowGarden</a></li>
          <li class="nav-item"><a class="nav-link fw-bold ${activePage === 'profile' ? 'text-warning' : 'text-dark'}" href="profile.html"><i class="fa-solid fa-user"></i> Profilo (${currentUser.username})</a></li>
          <li class="nav-item"><a class="nav-link fw-bold text-danger" href="#" id="logout-link"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
        `;
        document.getElementById('logout-link')?.addEventListener('click', (e) => {
          e.preventDefault();
          clearCurrentUser();
          window.location.href = 'index.html';
        });
      } else {
        window.location.replace('index.html');
      }
      return currentUser;
    }

    const currentUser = renderNavbar('feed');
    if (currentUser) {
      listenToFeed();
      // Registrazione del Service Worker per abilitare le notifiche di sistema
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').then(reg => {
          console.log('Service Worker attivo per le notifiche di sistema.');
        });
      }
    }

    function formatPostTimestamp(post) {
      if (post.date && post.time) {
        return `${post.date} - ${post.time}`;
      } else if (post.createdAt) {
        const d = new Date(post.createdAt);
        return `${d.toLocaleDateString('it-IT')} - ${d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
      }
      return post.time || '';
    }

    function listenToFeed() {
      const catsRef = ref(db, 'cats');
      onValue(catsRef, (snapshot) => {
        const container = document.getElementById('feed-container');
        container.innerHTML = '';

        if (snapshot.exists()) {
          const data = snapshot.val();
          const catList = Object.keys(data).map(key => ({ id: key, ...data[key] })).reverse();

          catList.forEach((post) => {
            if (post.deleted === true) return;

            const likesMap = post.likes || {};
            const likesCount = Object.keys(likesMap).length;
            const isLiked = currentUser && likesMap[currentUser.id];
            const dateTimeStr = formatPostTimestamp(post);

            const card = document.createElement('div');
            card.className = "glass-card overflow-hidden";
            card.innerHTML = `
              <div class="p-3 d-flex align-items-center gap-2 border-bottom">
                <div class="fw-bold text-dark" style="cursor: pointer;" onclick="window.location.href='profile-view.html?user=${encodeURIComponent(post.author)}'">
                  <i class="fa-solid fa-circle-user text-warning"></i> ${post.author}
                </div>
                <span class="small text-muted ms-auto"><i class="fa-regular fa-calendar-days me-1"></i>${dateTimeStr}</span>
              </div>
              <img src="${post.imageUrl}" class="cat-post-img" alt="${post.catName}">
              <div class="p-3">
                <div class="d-flex align-items-center gap-3 mb-2">
                  <button class="btn btn-link p-0 text-decoration-none btn-like fs-4 ${isLiked ? 'liked' : ''}" onclick="toggleLike('${post.id}')">
                    <i class="${isLiked ? 'fa-solid' : 'fa-regular'} fa-heart"></i>
                  </button>
                  <span class="fw-bold text-dark">${likesCount} Mi piace</span>
                </div>
                <h5 class="fw-bold text-dark mb-0">${post.catName}</h5>
              </div>
            `;
            container.appendChild(card);
          });
        }
      });
    }

    window.toggleLike = async function (postId) {
      if (!currentUser) return;
      const likeRef = ref(db, `cats/${postId}/likes/${currentUser.id}`);
      const snap = await get(likeRef);
      if (snap.exists()) {
        await update(ref(db, `cats/${postId}/likes`), { [currentUser.id]: null });
      } else {
        await update(ref(db, `cats/${postId}/likes`), { [currentUser.id]: true });
      }
    };
  </script>
</body>
</html>
