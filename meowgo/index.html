<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeowGo - Accedi 🐾</title>

  <!-- PWA & Meta Tag Mobile -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#b45309">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MeowGo">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      background: linear-gradient(135deg, #f5f0eb 0%, #e6d5c3 50%, #d4a373 100%);
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      color: #3d312a;
    }

    #garden-container-box {
      width: 100%;
      max-width: 450px;
      aspect-ratio: 9 / 16;
      margin: 0 auto;
      position: relative;
      background-image: url('https://i.ibb.co/93HyWQJ1/1784837930021.jpg');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      border: 8px solid #3d2314;
      border-radius: 1.5rem;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
    }

    #cats-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    .glass-card {
      background: rgba(255, 253, 250, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(210, 180, 140, 0.4);
      border-radius: 1.5rem;
      box-shadow: 0 10px 30px rgba(80, 50, 20, 0.1);
    }

    .navbar-glass {
      background: rgba(255, 253, 250, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(210, 180, 140, 0.3);
    }

    .avatar-circle {
      width: 70px; height: 70px;
      background: linear-gradient(45deg, #d97706, #b45309);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.2rem;
      border: 3px solid #fff;
      color: white;
    }

    .cat-post-img {
      width: 100%; height: 350px;
      object-fit: cover;
    }

    .page-section { display: none; }
    .page-section.active { display: block; animation: fadeIn 0.3s ease-in-out; }

    .btn-like { color: #8c7a6b; transition: transform 0.2s; }
    .btn-like.liked { color: #dc2626; transform: scale(1.1); }

    .auth-toggle-btn { cursor: pointer; color: #b45309; font-weight: bold; text-decoration: underline; }

    .badge-card {
      background: rgba(245, 238, 230, 0.8);
      border-radius: 1rem;
      padding: 8px 4px;
      text-align: center;
      border: 2px solid transparent;
      transition: all 0.3s ease;
      filter: grayscale(100%);
      opacity: 0.35;
    }

    .badge-card.unlocked {
      filter: grayscale(0%);
      opacity: 1;
      background: #fff;
      border-color: #f59e0b;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
    }

    .secret-badge-col { display: none; }

    .secret-badge-col.unlocked {
      display: block;
      animation: popIn 0.4s ease-out;
    }

    .secret-badge-col.unlocked .badge-card {
      filter: grayscale(0%);
      opacity: 1;
      background: #fffbeb;
      border-color: #b45309;
      box-shadow: 0 4px 12px rgba(180, 83, 9, 0.3);
    }

    .badge-icon {
      font-size: 1.6rem;
      margin-bottom: 2px;
    }

    .btn-earth {
      background: linear-gradient(45deg, #88502f, #b45309);
      color: white;
      border: none;
    }
    .btn-earth:hover {
      background: linear-gradient(45deg, #6e3f23, #92400e);
      color: white;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body class="pb-5">

  <nav class="navbar navbar-expand-lg navbar-light sticky-top navbar-glass mb-4 position-relative z-3">
    <div class="container">
      <a class="navbar-brand fw-black fs-3 text-dark d-flex align-items-center gap-2" href="feed.html">
        <i class="fa-solid fa-cat" style="color: #b45309;"></i> MeowGo
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto gap-2 mt-2 mt-lg-0" id="nav-links"></ul>
      </div>
    </div>
  </nav>

  <div class="container position-relative z-1">
    <section id="login-page" class="page-section active">
      <div class="row justify-content-center py-4">
        <div class="col-md-6 col-lg-5">
          <div class="glass-card p-4 p-md-5 text-center">
            <div class="fs-1 mb-2">🌿🐾</div>
            <h2 class="fw-bold mb-1" id="auth-title">Accedi a MeowGo</h2>
            <p class="text-muted small mb-4" id="auth-subtitle">Accedi o registrati</p>

            <div id="auth-error" class="alert alert-danger d-none small p-2 mb-3" role="alert"></div>

            <form id="auth-form">
              <div class="form-floating mb-3 text-start d-none" id="username-container">
                <input type="text" class="form-control rounded-3" id="auth-username" placeholder="CatMaster">
                <label for="auth-username">Nome Utente (Nickname)</label>
              </div>

              <div class="form-floating mb-3 text-start">
                <input type="email" class="form-control rounded-3" id="auth-email" placeholder="nome@esempio.it" required>
                <label for="auth-email">Email</label>
              </div>

              <div class="form-floating mb-4 text-start">
                <input type="password" class="form-control rounded-3" id="auth-password" placeholder="Password" required>
                <label for="auth-password">Password</label>
              </div>

              <button type="submit" id="auth-submit-btn" class="btn btn-earth btn-lg w-100 rounded-3 fw-bold shadow-sm">
                Accedi 🚀
              </button>
            </form>

            <div class="mt-4 pt-3 border-top small text-muted">
              <span id="auth-switch-text">Non hai ancora un account?</span>
              <span class="auth-toggle-btn" onclick="toggleAuthMode()">Registrati ora</span>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- JS Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Registrazione Service Worker, Permessi Notifiche e Badge Icona -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const reg = await navigator.serviceWorker.register('./sw.js');
          console.log('Service Worker registrato:', reg.scope);

          // Richiesta automatica permessi per le notifiche
          if ('Notification' in window && Notification.permission === 'default') {
            await Notification.requestPermission();
          }
        } catch (err) {
          console.error('Errore registrazione Service Worker:', err);
        }
      });
    }

    // Helper globale per inviare notifiche (XP, Badge, Novità)
    window.notifyUser = function(title, message, targetPage = './profile.html') {
      if ('Notification' in window && Notification.permission === 'granted' && navigator.serviceWorker.controller) {
        navigator.serviceWorker.ready.then((registration) => {
          registration.showNotification(title, {
            body: message,
            icon: 'icons/icon-192.png',
            badge: 'icons/icon-192.png',
            vibrate: [200, 100, 200],
            data: { url: targetPage }
          });
        });
      }
    };

    // Helper globale per aggiornare il numero di Badge sull'icona della Home
    window.setAppBadgeCount = function(count) {
      if ('setAppBadge' in navigator) {
        navigator.setAppBadge(count).catch((err) => console.error('Errore badge:', err));
      }
    };
  </script>

  <!-- Firebase & Logica di Autenticazione -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
      getDatabase, ref, push, get, child, update, onValue
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const IMGBB_API_KEY = "b2bd2cbba6ca0679055dc317aa5bf613";

    const firebaseConfig = {
      apiKey: "AIzaSyDAwgqotGF0BTUGBjxOMseMMfXpBZdAUTI",
      authDomain: "meowmaster-51991.firebaseapp.com",
      databaseURL: "https://meowmaster-51991-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "meowmaster-51991",
      storageBucket: "meowmaster-51991.firebasestorage.app",
      messagingSenderId: "1079993425259",
      appId: "1:1079993425259:web:1aa6a9e5f0a65b6ee4802e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    function getCurrentUser() {
      return JSON.parse(localStorage.getItem('meowgo_test_user')) || null;
    }
    function setCurrentUser(user) {
      localStorage.setItem('meowgo_test_user', JSON.stringify(user));
    }
    function clearCurrentUser() {
      localStorage.removeItem('meowgo_test_user');
    }

    function renderNavbar(activePage, requireAuth = true) {
      const currentUser = getCurrentUser();
      const navLinks = document.getElementById('nav-links');

      if (currentUser) {
        navLinks.innerHTML = `
          <li class="nav-item"><a class="nav-link fw-bold ${activePage === 'feed' ? 'text-warning' : 'text-dark'}" href="feed.html"><i class="fa-solid fa-newspaper"></i> Feed</a></li>
          <li class="nav-item"><a class="nav-link fw-bold ${activePage === 'garden' ? 'text-warning' : 'text-success'}" href="garden.html"><i class="fa-solid fa-tree"></i> MeowGarden</a></li>
          <li class="nav-item"><a class="nav-link fw-bold ${activePage === 'profile' ? 'text-warning' : 'text-dark'}" href="profile.html"><i class="fa-solid fa-user"></i> Profilo (${currentUser.username})</a></li>
          <li class="nav-item"><a class="nav-link fw-bold text-danger" href="#" id="logout-link"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
        `;
        const logoutLink = document.getElementById('logout-link');
        if (logoutLink) {
          logoutLink.addEventListener('click', (e) => {
            e.preventDefault();
            clearCurrentUser();
            window.location.href = 'index.html';
          });
        }
      } else {
        navLinks.innerHTML = `
          <li class="nav-item"><a class="nav-link fw-bold text-dark" href="index.html"><i class="fa-solid fa-right-to-bracket"></i> Accedi</a></li>
        `;
        if (requireAuth && activePage !== 'login') {
          window.location.replace('index.html');
        }
      }

      return currentUser;
    }

    if (getCurrentUser()) {
      window.location.replace('feed.html');
    } else {
      renderNavbar('login', false);
    }

    let isRegisterMode = false;

    window.toggleAuthMode = function () {
      isRegisterMode = !isRegisterMode;
      document.getElementById('auth-error').classList.add('d-none');

      if (isRegisterMode) {
        document.getElementById('auth-title').innerText = "Nuova Registrazione";
        document.getElementById('auth-subtitle').innerText = "Salva utente.";
        document.getElementById('username-container').classList.remove('d-none');
        document.getElementById('auth-username').setAttribute('required', 'true');
        document.getElementById('auth-submit-btn').innerText = "Registrati Ora 🚀";
        document.getElementById('auth-switch-text').innerText = "Hai già un account?";
      } else {
        document.getElementById('auth-title').innerText = "Accedi a MeowGo";
        document.getElementById('auth-subtitle').innerText = "Verifica credenziali.";
        document.getElementById('username-container').classList.add('d-none');
        document.getElementById('auth-username').removeAttribute('required');
        document.getElementById('auth-submit-btn').innerText = "Accedi 🚀";
        document.getElementById('auth-switch-text').innerText = "Non hai ancora un account?";
      }
    };

    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('auth-email').value.trim().toLowerCase();
      const password = document.getElementById('auth-password').value;
      const username = document.getElementById('auth-username').value.trim();
      const errorDiv = document.getElementById('auth-error');
      const submitBtn = document.getElementById('auth-submit-btn');

      errorDiv.classList.add('d-none');
      submitBtn.disabled = true;

      try {
        const dbRef = ref(db);
        const snapshot = await get(child(dbRef, 'users'));
        const usersData = snapshot.exists() ? snapshot.val() : {};

        let currentUser;

        if (isRegisterMode) {
          for (let id in usersData) {
            if (usersData[id].email === email) throw new Error("Email già registrata!");
          }

          const newUserRef = push(ref(db, 'users'));
          const newUser = { username, email, password, xp: 0, catsFound: 0, badges: {} };

          await update(newUserRef, newUser);
          currentUser = { id: newUserRef.key, ...newUser };

          // Notifica di benvenuto per la registrazione
          if (window.notifyUser) {
            window.notifyUser('Benvenuto su MeowGo! 🐾', 'Inizia subito a esplorare il MeowGarden!');
          }

        } else {
          let foundUser = null;
          for (let id in usersData) {
            if (usersData[id].email === email && usersData[id].password === password) {
              foundUser = { id: id, ...usersData[id] };
              break;
            }
          }

          if (!foundUser) throw new Error("Credenziali errate o utente non trovato.");
          currentUser = foundUser;
        }

        setCurrentUser(currentUser);
        window.location.href = 'feed.html';

      } catch (err) {
        errorDiv.innerText = err.message;
        errorDiv.classList.remove('d-none');
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
