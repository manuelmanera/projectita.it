<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profilo - MeowGo</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #1f1c2c 0%, #928dab 100%);
      color: #fff;
      min-height: 100vh;
      padding-bottom: 80px;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .profile-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #ff7e5f;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .progress {
      height: 16px;
      border-radius: 10px;
      background-color: rgba(255, 255, 255, 0.2);
    }

    .progress-bar {
      background: linear-gradient(90deg, #ff7e5f, #feb47b);
      border-radius: 10px;
    }

    .badge-card {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      transition: transform 0.2s;
    }

    .badge-card:hover {
      transform: translateY(-3px);
    }

    .badge-card.locked {
      opacity: 0.4;
      filter: grayscale(100%);
    }

    .badge-icon {
      font-size: 2rem;
      margin-bottom: 8px;
    }

    /* Modal Styling */
    .modal-content {
      background: #2b2738;
      color: #fff;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-gradient {
      background: linear-gradient(90deg, #ff7e5f, #feb47b);
      border: none;
      color: white;
      font-weight: 600;
      border-radius: 12px;
      padding: 10px 20px;
    }

    .btn-gradient:hover {
      opacity: 0.9;
      color: white;
    }
  </style>
</head>
<body>

  <div class="container py-4">
    <!-- Intestazione Profilo -->
    <div class="glass-card text-center">
      <img id="userAvatar" src="https://via.placeholder.com/100?text=Gatto" alt="Avatar" class="profile-avatar mb-3">
      <h3 id="usernameDisplay" class="fw-bold mb-1">Caricamento...</h3>
      <p id="userRankDisplay" class="text-warning mb-3"><i class="fa-solid fa-paw me-1"></i> Esploratore Felino</p>

      <!-- Barra dei Progressi / XP -->
      <div class="text-start mb-2 d-flex justify-content-between text-sm">
        <span id="levelDisplay">Livello 1</span>
        <span id="xpDisplay">0 / 1000 XP</span>
      </div>
      <div class="progress">
        <div id="xpProgressBar" class="progress-bar" role="progressbar" style="width: 0%"></div>
      </div>
    </div>

    <!-- Azione Rapida: Carica Gatto -->
    <div class="d-grid mb-4">
      <button class="btn btn-gradient btn-lg shadow" data-bs-toggle="modal" data-bs-target="#uploadModal">
        <i class="fa-solid fa-camera me-2"></i> Registra Nuovo Gatto
      </button>
    </div>

    <!-- Sezione Badge e Trofei -->
    <div class="glass-card">
      <h5 class="fw-bold mb-3"><i class="fa-solid fa-award me-2 text-warning"></i>I Tuoi Badge</h5>
      <div class="row g-3" id="badgesContainer">
        <!-- Renderizzato dinamicamente da JS -->
      </div>
    </div>
  </div>

  <!-- Modal di Upload Gatto -->
  <div class="modal fade" id="uploadModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-0">
          <h5 class="modal-title fw-bold"><i class="fa-solid fa-cat me-2"></i>Nuovo Avvistamento</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="catUploadForm" onsubmit="handleCatUpload(event)">
            <div class="mb-3">
              <label for="catName" class="form-label">Nome del Gatto</label>
              <input type="text" class="form-control bg-dark text-white border-secondary" id="catName" placeholder="es. Pallina, Maranza, Micio" required>
            </div>
            <div class="mb-3">
              <label for="catDescription" class="form-label">Descrizione / Note</label>
              <textarea class="form-control bg-dark text-white border-secondary" id="catDescription" rows="2" placeholder="Dove l'hai trovato? Cosa stava facendo?"></textarea>
            </div>
            <div class="mb-3">
              <label for="catImage" class="form-label">Foto del Gatto</label>
              <input type="file" class="form-control bg-dark text-white border-secondary" id="catImage" accept="image/*" required>
            </div>
            <div class="d-grid gap-2 mt-4">
              <button type="submit" id="uploadSubmitBtn" class="btn btn-gradient">Aggiungi al Pokédex Felino</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- SDK Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // --------------------------------------------------
    // CONFIGURAZIONE FIREBASE
    // --------------------------------------------------
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      databaseURL: "YOUR_DATABASE_URL",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    // Carica utente da LocalStorage
    let currentUser = JSON.parse(localStorage.getItem('currentUser')) || {
      id: "usr_" + Math.random().toString(36).substr(2, 9),
      username: "GattaroAnonimo",
      xp: 0,
      level: 1,
      catsFound: 0,
      badges: {}
    };

    // --------------------------------------------------
    // 1. TRACCIAMENTO EVENTI (ANALYTICS)
    // --------------------------------------------------
    function trackEvent(eventName, eventData = {}) {
      const userId = currentUser ? currentUser.id : 'anonymous';
      const timestamp = Date.now();

      firebase.database().ref(`analytics/${userId}/${timestamp}`).set({
        event: eventName,
        data: eventData,
        date: new Date().toISOString()
      }).catch(err => console.error("Errore tracciamento evento:", err));
    }

    // --------------------------------------------------
    // 2. GESTIONE UPLOAD GATTO CON GAMIFICATION & DELAY
    // --------------------------------------------------
    async function handleCatUpload(event) {
      event.preventDefault();

      const nameInput = document.getElementById('catName');
      const descInput = document.getElementById('catDescription');
      const imageInput = document.getElementById('catImage');
      const submitBtn = document.getElementById('uploadSubmitBtn');

      const catName = nameInput.value.trim();
      const catDescription = descInput.value.trim();
      const file = imageInput.files[0];

      if (!catName || !file) {
        alert("Inserisci il nome del gatto e seleziona un'immagine!");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "Caricamento in corso...";

      try {
        // A) Upload immagine su ImgBB
        const formData = new FormData();
        formData.append('image', file);

        const imgbbApiKey = 'b2bd...613'; // La tua API Key ImgBB
        const response = await fetch(`https://api.imgbb.com/1/upload?key=${imgbbApiKey}`, {
          method: 'POST',
          body: formData
        });

        const imgData = await response.json();
        if (!imgData.success) {
          throw new Error("Caricamento immagine fallito");
        }

        const imageUrl = imgData.data.url;

        // B) Avanzamento XP, Livello e Badge Segreti
        const xpGained = 150;
        let currentXp = (currentUser.xp || 0) + xpGained;
        let newCatsFound = (currentUser.catsFound || 0) + 1;
        let currentLevel = Math.floor(currentXp / 1000) + 1;

        let unlockedSecretBadge = checkSecretBadges(catName);

        // C) Salvataggio Gatto su Firebase
        const newCatRef = firebase.database().ref('cats').push();
        const catPayload = {
          id: newCatRef.key,
          name: catName,
          description: catDescription,
          imageUrl: imageUrl,
          ownerId: currentUser.id,
          ownerName: currentUser.username || "Gattaro",
          createdAt: Date.now()
        };
        await newCatRef.set(catPayload);

        // D) Aggiornamento Utente su Firebase
        const userUpdates = {
          xp: currentXp,
          catsFound: newCatsFound,
          level: currentLevel
        };

        if (unlockedSecretBadge) {
          userUpdates[`badges/${unlockedSecretBadge.id}`] = true;
        }

        await firebase.database().ref(`users/${currentUser.id}`).update(userUpdates);

        // Aggiorna stato locale
        currentUser.xp = currentXp;
        currentUser.catsFound = newCatsFound;
        currentUser.level = currentLevel;
        if (unlockedSecretBadge) {
          currentUser.badges = currentUser.badges || {};
          currentUser.badges[unlockedSecretBadge.id] = true;
        }
        localStorage.setItem('currentUser', JSON.stringify(currentUser));

        // E) Analytics Event
        trackEvent('cat_uploaded', {
          catName: catName,
          xpGained: xpGained,
          unlockedSecret: unlockedSecretBadge ? unlockedSecretBadge.id : null
        });

        // F) Coriandoli & Delay per vedere l'effetto prima del redirect
        if (typeof confetti === 'function') {
          confetti({
            particleCount: unlockedSecretBadge ? 120 : 60,
            spread: 70,
            origin: { y: 0.6 }
          });
        }

        setTimeout(() => {
          window.location.href = 'feed.html';
        }, 1200);

      } catch (error) {
        console.error("Errore durante l'upload:", error);
        alert("Si è verificato un errore durante l'upload. Riprova!");
        submitBtn.disabled = false;
        submitBtn.innerText = "Aggiungi al Pokédex Felino";
      }
    }

    // --------------------------------------------------
    // 3. LOGICA BADGE SEGRETI (EASTER EGGS)
    // --------------------------------------------------
    function checkSecretBadges(catName) {
      const nameLower = catName.toLowerCase();
      const secretMap = [
        { key: 'pelato', id: 'badge_pelata', title: 'Gatto Sfinse' },
        { key: 'maranza', id: 'badge_maranza', title: 'Tuta Tech' },
        { key: 'pizza', id: 'badge_pizzaiolo', title: 'Mastro Pizzaiolo' },
        { key: 'polizia', id: 'badge_poliziotto', title: 'Agente Felino' }
      ];

      for (let badge of secretMap) {
        if (nameLower.includes(badge.key)) {
          trackEvent('secret_badge_unlocked', { badgeId: badge.id, catName: catName });
          return badge;
        }
      }
      return null;
    }

    // --------------------------------------------------
    // 4. AGGIORNAMENTO DELL'INTERFACCIA UTENTE
    // --------------------------------------------------
    function updateUI() {
      document.getElementById('usernameDisplay').innerText = currentUser.username || "GattaroAnonimo";
      
      const xp = currentUser.xp || 0;
      const level = Math.floor(xp / 1000) + 1;
      const xpInCurrentLevel = xp % 1000;
      const progressPercent = (xpInCurrentLevel / 1000) * 100;

      document.getElementById('levelDisplay').innerText = `Livello ${level}`;
      document.getElementById('xpDisplay').innerText = `${xpInCurrentLevel} / 1000 XP`;
      document.getElementById('xpProgressBar').style.width = `${progressPercent}%`;

      renderBadges();
    }

    // Renderizza la griglia dei badge
    function renderBadges() {
      const badgesList = [
        { id: 'badge_first', title: 'Primo Gatto', icon: 'fa-paw', desc: 'Carica il tuo 1° gatto' },
        { id: 'badge_pelata', title: 'Gatto Sfinse', icon: 'fa-user-ninja', desc: 'Segreto: Nome con "pelato"' },
        { id: 'badge_maranza', title: 'Tuta Tech', icon: 'fa-shirt', desc: 'Segreto: Nome con "maranza"' },
        { id: 'badge_pizzaiolo', title: 'Pizzaiolo', icon: 'fa-pizza-slice', desc: 'Segreto: Nome con "pizza"' },
        { id: 'badge_poliziotto', title: 'Poliziotto', icon: 'fa-shield-cat', desc: 'Segreto: Nome con "polizia"' }
      ];

      const container = document.getElementById('badgesContainer');
      container.innerHTML = '';

      badgesList.forEach(b => {
        const isUnlocked = currentUser.badges && currentUser.badges[b.id];
        const col = document.createElement('div');
        col.className = 'col-6 col-md-4';
        col.innerHTML = `
          <div class="badge-card ${isUnlocked ? '' : 'locked'}">
            <i class="fa-solid ${b.icon} badge-icon text-warning"></i>
            <h6 class="fw-bold mb-1">${b.title}</h6>
            <small class="text-white-50" style="font-size: 0.75rem;">${b.desc}</small>
          </div>
        `;
        container.appendChild(col);
      });
    }

    // Inizializzazione pagina
    document.addEventListener('DOMContentLoaded', () => {
      updateUI();
      trackEvent('profile_page_view');
    });
  </script>
</body>
</html>
